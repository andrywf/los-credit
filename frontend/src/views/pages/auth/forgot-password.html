<div class="form-card">
	<div class="forgot-header">
		<div class="forgot-icon">
			<i class="bi bi-key"></i>
		</div>
		<h3 class="forgot-title">Forgot password?</h3>
		<p class="forgot-subtitle">Enter your account email and we will send you a reset link.</p>
	</div>

	<form id="forgot-form" novalidate>
		<div class="mb-3">
			<label for="input_email" class="form-label fw-semibold">Email address</label>
			<div class="form-control-feedback form-control-feedback-start">
				<div class="form-control-feedback-icon">
					<i class="bi bi-envelope text-secondary"></i>
				</div>
				<input type="email" class="form-control" id="input_email" placeholder="you@email.com" autocomplete="email">
			</div>
		</div>
		<button type="submit" class="btn btn-lime w-100">
			<i class="bi bi-unlock me-2"></i>
			Forgot Password
		</button>
	</form>
</div>
