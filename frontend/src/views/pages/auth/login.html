<div class="form-card">
	<h2>Sign in to your workspace</h2>
	<p class="lead-sm">Use your company email and password to continue.</p>
	<form id="auth-form" novalidate>
		<div class="mb-3">
			<label for="input_email" class="form-label fw-semibold">Email address</label>
			<div class="form-control-feedback form-control-feedback-start">
				<div class="form-control-feedback-icon">
					<i class="bi bi-envelope text-secondary"></i>
				</div>
				<input type="email" class="form-control" id="input_email" placeholder="you@email.com" autocomplete="email">
			</div>
		</div>

		<div class="mb-3">
			<label class="form-label fw-semibold" for="input_password">Password</label>
			<div class="form-control-feedback form-control-feedback-start form-control-feedback-end">
				<div class="form-control-feedback-icon">
					<i class="bi bi-lock text-secondary"></i>
				</div>
				<input type="password" class="form-control" id="input_password" placeholder="••••••••" autocomplete="current-password">
				<button type="button" class="form-control-feedback-icon" aria-label="Show password" data-toggle-password>
					<i class="bi bi-eye"></i>
				</button>
			</div>
		</div>

		<div class="d-flex align-items-center justify-content-between mt-3 mb-3">
			<div class="form-check d-flex align-items-center mb-0">
				<input class="form-check-input" type="checkbox" id="remember">
				<label class="form-check-label" for="remember" style="font-size:.85rem;color:var(--text-muted)">Remember me</label>
			</div>
			<a href="#" class="link-accent" style="font-size:.83rem">Forgot password?</a>
		</div>

		<button type="submit" class="btn btn-lime w-100">Sign in</button>
	</form>

	<p class="card-foot">
		Trouble signing in? <a href="#" class="link-accent">Contact IT support</a>
	</p>
</div>
